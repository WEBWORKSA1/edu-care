# INSTALL ONCE: GitHub blocks apps from writing workflow files, so copy this file to
#   .github/workflows/update-content.yml
# (GitHub web: Add file > Create new file > name it .github/workflows/update-content.yml > paste > Commit.)
# Then: Actions tab > "Auto-update content" > Run workflow. It then runs every 6 hours by itself.
name: Auto-update content

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-content
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch news and videos
        run: python scripts/update_feeds.py
      - name: Commit changes
        run: |
          git config user.name "edu-care-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/videos.json sitemap.xml
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Auto-update news and videos"
          git pull --rebase origin main
          git push origin HEAD:main
